<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica de Eventos - Cristian</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container"></div>
        <h1 class="title">Práctica Eventos Cristian</h1>

        <div class="click__container">
            <h2 class="click__title">N°1 - Dale Click al botón</h2>
            <p class="click__text">Tendrás que darle click al botón cuantas veces quieras!</p>
            <p class="click__text">Llevas <span id="counter">0</span> Clicks</p>
            <div class="btn__container">
                <button class="click__btn" id="click">Click</button>
                <button class="click__btn click__btn--reset" id="reset">Reset</button>
            </div>
        </div>

                <div class="click__container">
            <h2 class="click__title">N°2 - Pasa el mouse sobre el elemento</h2>
            <p class="click__text">Tendrás que darle click al botón cuantas veces quieras!</p>
            <div class="box" id="box">Este es el elemento</div>
        </div>
    <script src="cristapp.js"></script>
</body>

</html>
